server:
  port: 8084

spring:
  application:
    name: correlation-service

  datasource:
    url: jdbc:postgresql://${CORRELATION_DB_HOST:localhost}:${CORRELATION_DB_PORT:5432}/correlation_db
    username: ${CORRELATION_DB_USERNAME:demo}
    password: ${CORRELATION_DB_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: correlation-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
