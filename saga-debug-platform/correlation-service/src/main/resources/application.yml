server:
  port: 8084

spring:
  application:
    name: correlation-service

  datasource:
    url: jdbc:postgresql://${CORRELATION_DB_HOST:localhost}:${CORRELATION_DB_PORT:5432}/correlation_db
    username: ${CORRELATION_DB_USERNAME:demo}
    password: ${CORRELATION_DB_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: correlation-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ============================================================================
# RCA rule-ranking weights.
#
# Default profile: "confidence-only" — reproduces the legacy "sort by confidence"
# behaviour exactly (w_c=1.0, others=0). This makes adding the ranking scaffold
# behaviour-preserving for existing tests.
#
# Override via Spring profile during ablation:
#   --spring.profiles.active=rca-equal-weight
#   --spring.profiles.active=rca-confidence-heavy
#   --spring.profiles.active=rca-severity-heavy
#   --spring.profiles.active=rca-evidence-heavy
# (corresponding application-rca-*.yml files supply the alternative weights)
# ============================================================================
rca:
  ranking:
    profile-name: confidence-only
    confidence-weight: 1.0
    severity-weight: 0.0
    evidence-weight: 0.0
