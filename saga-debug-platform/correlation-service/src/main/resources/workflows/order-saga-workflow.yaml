workflow:
  name: ORDER_SAGA
  version: "1.0"

  steps:
    - id: CREATE_ORDER
      service: order-service
      timeout: 5s
      compensation: CANCEL_ORDER
      events:
        started: ORDER_CREATED
        completed: ORDER_CREATED
        failed: ORDER_FAILED

    - id: PROCESS_PAYMENT
      service: payment-service
      timeout: 10s
      compensation: REFUND_PAYMENT
      retryPolicy:
        maxAttempts: 3
        backoff: exponential
      events:
        started: PAYMENT_STARTED
        completed: PAYMENT_COMPLETED
        failed: PAYMENT_FAILED
        # Emitted by the Resilience4j retry listener on each failed attempt.
        # Declared here so the projection can attribute retries to this step
        # instead of the detectors hard-coding the PAYMENT_RETRY event name.
        retry: PAYMENT_RETRY

    - id: RESERVE_INVENTORY
      service: inventory-service
      timeout: 5s
      compensation: RELEASE_INVENTORY
      events:
        started: INVENTORY_STARTED
        completed: INVENTORY_RESERVED
        failed: INVENTORY_FAILED

  compensationSteps:
    - id: REFUND_PAYMENT
      service: payment-service
      timeout: 10s
      events:
        started: REFUND_PAYMENT
        completed: PAYMENT_REFUNDED
        failed: REFUND_FAILED

  transitions:
    - from: STARTED
      to: CREATE_ORDER
    - from: CREATE_ORDER
      to: PROCESS_PAYMENT
      condition: SUCCESS
    - from: PROCESS_PAYMENT
      to: RESERVE_INVENTORY
      condition: SUCCESS
    - from: RESERVE_INVENTORY
      to: COMPLETED
      condition: SUCCESS
    # Failure transitions
    - from: CREATE_ORDER
      to: FAILED
      condition: FAILED
    - from: PROCESS_PAYMENT
      to: FAILED
      condition: FAILED
    - from: RESERVE_INVENTORY
      to: COMPENSATING
      condition: FAILED
    - from: COMPENSATING
      to: COMPENSATED
      condition: COMPENSATION_COMPLETE

  # Valid event type for each step
  validEventTypes:
    ORDER_CREATED: CREATE_ORDER
    PAYMENT_COMPLETED: PROCESS_PAYMENT
    PAYMENT_FAILED: PROCESS_PAYMENT
    INVENTORY_RESERVED: RESERVE_INVENTORY
    INVENTORY_FAILED: RESERVE_INVENTORY
    REFUND_PAYMENT: REFUND_PAYMENT
    PAYMENT_REFUNDED: REFUND_PAYMENT
