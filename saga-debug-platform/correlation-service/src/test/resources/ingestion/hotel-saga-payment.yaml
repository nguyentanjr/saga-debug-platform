# The payment side of semotpan/saga-orchestration. See hotel-saga-room-booking.yaml for
# why the correlation key and the identity are read from the transport rather than the
# body.
#
# A separate file rather than a wider topicPattern because the two sources share a field
# name with different meanings: `status` is CANCELLED on both topics, and it means "the
# room booking was released" on one and "the payment was reversed" on the other. One
# mapping cannot translate a value two ways, and inventing a shared vocabulary would be
# this platform asking the observed system to make sense on its terms.
#
# A GAP BETWEEN THE DECLARED STATES AND THE REACHABLE ONES
#
# PaymentStatus declares REQUESTED, COMPLETED, FAILED, CANCELLED, but Payment.paymentStatus()
# only ever returns REQUESTED, FAILED or CANCELLED — COMPLETED is unreachable. Success is
# signalled by REQUESTED, which the orchestrator maps to SagaStepStatus.SUCCEEDED
# (PaymentStatus.toSagaStepStatus: `case COMPLETED, REQUESTED -> SUCCEEDED`).
#
# So the event that means "the payment step succeeded" is named REQUESTED. Mapping it to
# anything else would describe the system as designed rather than as it runs, and the
# workflow specification is checked against runs. COMPLETED is mapped to the same outcome
# so the mapping stays correct if that path is ever implemented.

source:
  name: hotel-saga-payment

  # Both reply topics are one observed system, so both mappings name it and their events
  # share one execution namespace. Without this the same saga id is filed twice -- once
  # per mapping -- and every run reads as two half-finished executions.
  system: hotel-saga
  topicPattern: 'payment\.outbox\.events'

  fields:
    executionId: key
    eventId: header:id

    # PaymentStatus: REQUESTED | FAILED | CANCELLED reachable; COMPLETED declared only.
    eventType: status

  eventTypes:
    "REQUESTED": PAYMENT_ACCEPTED
    "COMPLETED": PAYMENT_ACCEPTED
    "FAILED": PAYMENT_REJECTED
    "CANCELLED": PAYMENT_REVERSED
