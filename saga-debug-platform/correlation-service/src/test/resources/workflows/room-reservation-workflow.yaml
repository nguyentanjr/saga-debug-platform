# The saga implemented by semotpan/saga-orchestration, written as a specification this
# platform can check executions against.
#
# Read out of RoomReservationSaga, RoomBookingEventHandler, Payment.paymentStatus() and
# the status enums in that repository — not from its README. The distinction mattered:
# the enums declare states the code never reaches, and a specification written from the
# declared states would have expected an event that never arrives. See the note on
# TAKE_PAYMENT below.
#
# The saga has two steps and one compensation:
#
#   book the room -> take the payment
#   payment rejected -> release the room booking
#
# Nothing in that project was modified. The whole integration is this file plus the two
# ingestion mappings: three YAML files, no Java.
#
# HOW TO PROVOKE EACH PATH, for anyone reproducing this:
#   room rejected   - request a room that does not exist or is already booked
#                     (RoomBookingEventHandler: possibleRoom.isEmpty() || isBooked())
#   payment rejected - use a credit card number ending in 9999
#                     (Payment.paymentStatus(), marked FIXME "demo purpose")

workflow:
  name: ROOM_RESERVATION
  version: "1.0"

  steps:
    - id: BOOK_ROOM
      service: hotel-service
      timeout: 30s
      compensation: RELEASE_ROOM
      events:
        completed: ROOM_BOOKED
        failed: ROOM_REJECTED

    - id: TAKE_PAYMENT
      service: payment-service
      timeout: 30s
      events:
        # PAYMENT_ACCEPTED is the mapped name for PaymentStatus.REQUESTED, which is what
        # this implementation emits on success — its COMPLETED state is unreachable. No
        # `started` event is declared because nothing is published when the step begins;
        # declaring one would have the platform wait for an event that never arrives.
        completed: PAYMENT_ACCEPTED
        failed: PAYMENT_REJECTED

  compensationSteps:
    # Releasing the room is what the reservation service asks for when payment is
    # rejected; the hotel service reports it as RoomBookingRequestStatus.CANCELLED.
    - id: RELEASE_ROOM
      service: hotel-service
      timeout: 30s
      events:
        completed: ROOM_CANCELLED

  transitions:
    - from: STARTED
      to: BOOK_ROOM

    - from: BOOK_ROOM
      to: TAKE_PAYMENT
      condition: SUCCESS

    - from: TAKE_PAYMENT
      to: COMPLETED
      condition: SUCCESS

    # A room that was never booked needs no releasing, so this failure ends the saga
    # rather than compensating.
    - from: BOOK_ROOM
      to: FAILED
      condition: FAILED

    # A rejected payment leaves a held room, which does need releasing.
    - from: TAKE_PAYMENT
      to: COMPENSATING
      condition: FAILED

    - from: RELEASE_ROOM
      to: COMPENSATED
      condition: SUCCESS
