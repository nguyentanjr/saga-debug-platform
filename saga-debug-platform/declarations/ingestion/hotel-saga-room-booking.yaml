# Reading an unmodified third-party system: semotpan/saga-orchestration.
#
# A public reference implementation of the saga orchestration pattern for hotel
# reservations (Java 21, Spring Boot, Kafka), using the transactional outbox pattern with
# Debezium's EventRouter. Nothing in it was changed to be observed here.
#
# WHY THIS SOURCE IS THE INTERESTING ONE
#
# Debezium's EventRouter is configured there with
#     transforms.outbox.table.expand.json.payload = true
#     transforms.outbox.table.fields.additional.placement = "type:header:eventType"
#     key.converter = StringConverter
#
# so a published record looks like:
#     key     = 3fa85f64-...        <- the saga id, as the record key
#     headers = id=..., eventType=RoomUpdated
#     value   = {"status":"BOOKED"}  <- the business payload, and nothing else
#
# The correlation key and the event identity are NOT IN THE BODY. Before source mappings
# could name the transport, this system was unreadable however its payload was mapped:
# every observation was rejected as NOT_CORRELATABLE. That is what motivated the `key` and
# `header:NAME` forms below.
#
# WHY eventType COMES FROM THE PAYLOAD, NOT THE HEADER
#
# The header carries "RoomUpdated" for every outcome, which cannot tell a booking from a
# rejection. The payload's `status` can, and the workflow specification is written about
# outcomes. So the header is used for identity, the payload for meaning — each field read
# from wherever it actually is.

source:
  name: hotel-saga-room-booking

  # Four topics, one observed system, one id space. The reply and command topics need
  # separate mappings because their payloads share field names with different meanings --
  # `status` is CANCELLED on both reply topics and means "room released" on one and
  # "payment reversed" on the other -- but they are one saga with one id, and the
  # execution namespace follows the system rather than the file that read it.
  system: hotel-saga
  topicPattern: 'room-booking\.outbox\.events'

  fields:
    # Nothing on the record names the publisher; each outbox topic has exactly one.
    serviceName: const:hotel-service
    # The saga id, carried as the Kafka record key by Debezium's EventRouter.
    executionId: key

    # The outbox row's own id, which EventRouter places in a header. Using it rather than
    # falling back to partition-offset means a republished event is recognised as the same
    # event, so duplicate detection reports producer-side retries instead of missing them.
    eventId: header:id

    # RoomBookingStatus: BOOKED | REJECTED | CANCELLED.
    eventType: status

  # Their vocabulary against the workflow specification's. Both sides keep their own
  # names: CANCELLED means something different here than it does on the payment topic,
  # which is why this source has its own mapping rather than one shared file.
  eventTypes:
    "BOOKED": ROOM_BOOKED
    "REJECTED": ROOM_REJECTED
    "CANCELLED": ROOM_CANCELLED
