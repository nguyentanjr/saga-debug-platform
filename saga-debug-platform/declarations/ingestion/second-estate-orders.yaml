# A second estate that happens to use the same topic name as the first.
#
# Nothing exotic: two companies, two Kafka clusters, and both of them call the topic
# carrying new orders `order-created`. Before clusters were declarable, the platform could
# only read one of them, and reading both would have meant one mapping claiming records
# from two unrelated systems -- filing two estates' runs in one identity namespace, then
# reporting the differences between them as faults.
#
# `cluster:` is what makes the question answerable. It names a cluster declared under
# correlation.kafka.clusters, and this mapping then speaks only for records that arrived
# there. The mapping that ships for the demo estate names no cluster, so it still reads
# whatever it is given -- and a mapping that named this cluster wins over one that named
# none, so the two do not fight over a topic name they share.
source:
  name: second-estate-orders
  cluster: second-estate
  system: second-estate
  topicPattern: 'order-created'

  fields:
    eventId: eventId
    eventTime: occurredAt
    executionId: orderRef
    eventType: type
