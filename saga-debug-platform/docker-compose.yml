services:
  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - postgres
      - kafka
      - otel-collector
    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    environment:
      ORDER_DB_HOST: postgres
      ORDER_DB_PORT: 5432
      ORDER_DB_USERNAME: demo
      ORDER_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

      OTEL_SERVICE_NAME: order-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    ports:
      - "8081:8081"
      - "5005:5005"

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - postgres
      - kafka
      - otel-collector
    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    environment:
      PAYMENT_DB_HOST: postgres
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USERNAME: demo
      PAYMENT_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006

      OTEL_SERVICE_NAME: payment-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    ports:
      - "8082:8082"
      - "5006:5006"

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      - postgres
      - kafka
      - otel-collector
    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    environment:
      INVENTORY_DB_HOST: postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_USERNAME: demo
      INVENTORY_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007

      OTEL_SERVICE_NAME: inventory-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    ports:
      - "8083:8083"
      - "5007:5007"

  correlation-service:
    build: ./correlation-service
    container_name: correlation-service
    depends_on:
      - postgres
      - kafka
    environment:
      CORRELATION_DB_HOST: postgres
      CORRELATION_DB_PORT: 5432
      CORRELATION_DB_USERNAME: demo
      CORRELATION_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    volumes:
      - ./results:/app/results
    ports:
      - "8084:8084"

  postgres:
    image: postgres:15
    container_name: demo-postgres
    environment:
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo
      - POSTGRES_DB=order_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  kafka:
    image: apache/kafka:3.7.0
    container_name: demo-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@demo-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: demo-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC (exposed for direct access too)
      - "4318:4318"     # OTLP HTTP

  # ---- NEW: OpenTelemetry Collector ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    depends_on:
      - jaeger
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml
    command: ["--config", "/etc/otel/config.yaml"]
    ports:
      - "14317:4317"    # OTLP gRPC (collector)
      - "14318:4318"    # OTLP HTTP (collector)

  # ---- NEW: Toxiproxy for chaos testing ----
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    ports:
      - "8474:8474"     # Toxiproxy API
      - "19092:19092"   # Proxied Kafka
      - "15432:15432"   # Proxied Postgres

volumes:
  postgres_data:
  kafka_data:
