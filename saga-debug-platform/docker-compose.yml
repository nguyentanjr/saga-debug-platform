services:
  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - postgres
      - kafka
      - otel-collector
    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    environment:
      ORDER_DB_HOST: postgres
      ORDER_DB_PORT: 5432
      ORDER_DB_USERNAME: demo
      ORDER_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

      OTEL_SERVICE_NAME: order-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    ports:
      - "8081:8081"
      - "5005:5005"

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - postgres
      - kafka
      - otel-collector
    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    environment:
      PAYMENT_DB_HOST: postgres
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USERNAME: demo
      PAYMENT_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006

      OTEL_SERVICE_NAME: payment-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    ports:
      - "8082:8082"
      - "5006:5006"

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      - postgres
      - kafka
      - otel-collector
    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar
    environment:
      INVENTORY_DB_HOST: postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_USERNAME: demo
      INVENTORY_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007

      OTEL_SERVICE_NAME: inventory-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    ports:
      - "8083:8083"
      - "5007:5007"

  correlation-service:
    build: ./correlation-service
    container_name: correlation-service
    depends_on:
      - postgres
      - kafka
      - docker-events-proxy
    environment:
      CORRELATION_DB_HOST: postgres
      CORRELATION_DB_PORT: 5432
      CORRELATION_DB_USERNAME: demo
      CORRELATION_DB_PASSWORD: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Bearer token for writing observations over HTTP (/api/ingest, /api/admin/inject-event).
      # Unset = those writes are closed (503); Kafka ingestion is unaffected. evaluate.py
      # reads the same variable.
      CORRELATION_INGEST_TOKEN: ${CORRELATION_INGEST_TOKEN:-}

      # Declarations about an observed system -- how to read its events, what its saga is
      # supposed to do, what a symptom means there -- read from a mounted directory rather
      # than from inside the jar. Attaching to a system this image was never built with is
      # then a file plus a restart.
      CORRELATION_DECLARATIONS_DIR: /app/declarations

      # R23: when the runtime says the service a run waits on exited, that is evidence the
      # run's own events cannot give. Read through docker-events-proxy, never the engine
      # socket itself (ADR 0001). Set to false to measure the events-only observer.
      CORRELATION_LIVENESS_DOCKER_ENABLED: ${CORRELATION_LIVENESS_DOCKER_ENABLED:-true}
      CORRELATION_LIVENESS_DOCKER_ENDPOINT: tcp://docker-events-proxy:2375
    volumes:
      - ./results:/app/results
      - ./declarations:/app/declarations:ro
    ports:
      - "8084:8084"

  # The observer's only window onto the container runtime: forwards GET /events and refuses
  # every other engine call (no container start/stop/inspect, no POST at all), so
  # correlation-service can read lifecycle facts but cannot act on the observed system.
  docker-events-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-events-proxy
    environment:
      EVENTS: 1
      PING: 1
      VERSION: 0
      CONTAINERS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Demo tooling, not part of the observer. It creates orders and switches the payment
  # service into failure mode so the dashboard can produce a saga run on demand. That
  # capability used to live in correlation-service, which made the observer able to
  # command the systems it observes -- see docs/ADR/0001-observer-boundary.md.
  #
  # A real deployment of correlation-service does not run this.
  demo-scenarios:
    build: ./demo-scenarios
    container_name: demo-scenarios
    depends_on:
      - order-service
      - payment-service
    environment:
      SCENARIO_ORDER_SERVICE_URL: http://order-service:8081
      SCENARIO_PAYMENT_SERVICE_URL: http://payment-service:8082
      DEMO_ALLOWED_ORIGIN: ${DEMO_ALLOWED_ORIGIN:-http://localhost:4200}
    ports:
      - "8085:8085"

  postgres:
    image: postgres:15
    container_name: demo-postgres
    environment:
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo
      - POSTGRES_DB=order_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  kafka:
    image: apache/kafka:3.7.0
    container_name: demo-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@demo-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: demo-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC (exposed for direct access too)
      - "4318:4318"     # OTLP HTTP

  # ---- NEW: OpenTelemetry Collector ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    depends_on:
      - jaeger
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml
    command: ["--config", "/etc/otel/config.yaml"]
    ports:
      - "14317:4317"    # OTLP gRPC (collector)
      - "14318:4318"    # OTLP HTTP (collector)

  # ---- NEW: Toxiproxy for chaos testing ----
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    ports:
      - "8474:8474"     # Toxiproxy API
      - "19092:19092"   # Proxied Kafka
      - "15432:15432"   # Proxied Postgres

volumes:
  postgres_data:
  kafka_data:
