server:
  port: 8082

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5432}/payment_db
    username: ${PAYMENT_DB_USERNAME:demo}
    password: ${PAYMENT_DB_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >-
          orderCreatedEvent:com.example.saga.events.OrderCreatedEvent,
          refundPaymentCommand:com.example.saga.events.RefundPaymentCommand
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          paymentCompletedEvent:com.example.saga.events.PaymentCompletedEvent,
          paymentFailedEvent:com.example.saga.events.PaymentFailedEvent,
          paymentRefundedEvent:com.example.saga.events.PaymentRefundedEvent,
          retryAttemptedEvent:com.example.saga.events.RetryAttemptedEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true

# Resilience4j Configuration
# Aspect order: CircuitBreaker is OUTER, Retry is INNER. With this order:
#   CB.execute( () -> Retry.execute( actualMethod() ) )
# so the Retry aspect sees individual exception attempts and fires onRetry events
# (consumed by Resilience4jRetryListenerConfig to emit PAYMENT_RETRY).
# Once Retry exhausts, the exception propagates out to CircuitBreaker, which
# invokes the fallback method (handleOrderCreatedFallback → PAYMENT_FAILED).
# Default order is the reverse (Retry outer, CB inner), which causes CB's
# fallback to mask the exception from Retry → no retry happens.
resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      paymentProcessing:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    retry-aspect-order: 1
    instances:
      paymentProcessing:
        # maxAttempts = 4 → 1 initial call + 3 retries per failing saga.
        # This matches the correlation-service detectRetryBurst threshold
        # (BURST_THRESHOLD=3 retry events within BURST_WINDOW=60s) so that a
        # single failed saga emits enough PAYMENT_RETRY events to trigger
        # the RETRY_BURST anomaly. Reducing this would make the detector
        # require multiple sagas to fire concurrently.
        maxAttempts: 4
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      paymentProcessing:
        timeoutDuration: 5s
        cancelRunningFuture: true
