server:
  port: 8082

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5432}/payment_db
    username: ${PAYMENT_DB_USERNAME:demo}
    password: ${PAYMENT_DB_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >-
          orderCreatedEvent:com.example.saga.events.OrderCreatedEvent,
          refundPaymentCommand:com.example.saga.events.RefundPaymentCommand
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          paymentCompletedEvent:com.example.saga.events.PaymentCompletedEvent,
          paymentFailedEvent:com.example.saga.events.PaymentFailedEvent,
          paymentRefundedEvent:com.example.saga.events.PaymentRefundedEvent,
          retryAttemptedEvent:com.example.saga.events.RetryAttemptedEvent

# Exposed so the EVALUATION HARNESS can read this service's own breaker state when it
# records ground truth. The correlation-service reads none of this: it observes events,
# and R01's conclusion about a breaker is drawn from a failure payload, not from here.
# That is exactly why the harness needs an independent reading -- see docs/ORACLE.md §5.2.
#
# circuitbreakerevents is the one that matters: it records STATE_TRANSITIONs, so a breaker
# that opened and closed again inside a run can still be told apart from one that never
# opened. A point sample of health cannot do that.
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Resilience4j Configuration
# Aspect order: CircuitBreaker is OUTER, Retry is INNER. With this order:
#   CB.execute( () -> Retry.execute( actualMethod() ) )
# so the Retry aspect sees individual exception attempts and fires onRetry events
# (consumed by Resilience4jRetryListenerConfig to emit PAYMENT_RETRY).
# Once Retry exhausts, the exception propagates out to CircuitBreaker, which
# invokes the fallback method (handleOrderCreatedFallback → PAYMENT_FAILED).
# Default order is the reverse (Retry outer, CB inner), which causes CB's
# fallback to mask the exception from Retry → no retry happens.
resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      paymentProcessing:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    retry-aspect-order: 1
    instances:
      paymentProcessing:
        # maxAttempts = 4 → 1 initial call + 3 retries per failing saga.
        #
        # CAUTION — this value and the correlation-service detectRetryBurst threshold
        # (retry-burst-threshold = 3 within retry-burst-window = 60s) were set to match
        # each other. The observed system was tuned so the detector would fire, which
        # means a firing RETRY_BURST is not independent evidence that retry behaviour
        # was abnormal: 3 retries is exactly what this policy prescribes, so the
        # detector currently reports a step behaving to spec.
        #
        # Do not cite RETRY_BURST as a detection result without stating this coupling.
        # The finding itself now records "observed N retries; declared policy allows M"
        # so the comparison is visible in the evidence. Breaking the coupling means
        # deriving the threshold from something other than this value — see the
        # retryPolicy block in correlation-service workflows/order-saga-workflow.yaml.
        maxAttempts: 4
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      paymentProcessing:
        timeoutDuration: 5s
        cancelRunningFuture: true
