      gap_before_payment_completed_s: 48.843   # ORDER_CREATED -> PAYMENT_COMPLETED
      declared_timeout_for_that_step_s: 10     # PROCESS_PAYMENT
      failure_reason: null
      discriminating_field: >-
        Không trường nào mang dấu hiệu của loại sự cố. Tập observation này khác SC28/SC29 ở
        eventId, timestamp và transportRef, nhưng không khác ở bất kỳ thứ gì nói được đây
        là đóng băng, bị dừng bằng tín hiệu hay mất mạng. Hai mốc thời gian và ngưỡng khai
        báo thì có thật và trích dẫn được.

    admissible_claims:
      - STEP_EXCEEDED_DECLARED_TIMEOUT
      - EXECUTION_COMPLETED_AFTER_SILENCE
    abstention_required: false
    admissible_note: >-
      Mức cụ thể tối đa: "khoảng từ CREATE_ORDER tới khi PROCESS_PAYMENT hoàn tất là
      48.8 s, vượt timeout khai báo 10 s, rồi execution hoàn tất". Dừng ở đó.

    inadmissible_claims:
      SOURCE_SERVICE_UNAVAILABLE: >-
        VƯỢT BẰNG CHỨNG, không phải trái sự thật: ở ca này tiến trình thật sự bị đóng băng,
        nên claim tình cờ đúng. Nhưng không quan sát nào định vị được độ trễ — không có
        PAYMENT_STARTED, không có tín hiệu health — nên tập này không xác lập được nó.
        Ba kịch bản cùng hình dạng, ba sự thật khác nhau: nêu tên loại nào cũng là chọn một
        trong ba mà không có gì để chọn.
      SOURCE_SERVICE_SELF_RECOVERED: >-
        Phục hồi do harness gọi unpause. Và bằng chứng không tách tự hồi phục khỏi can
        thiệp thủ công hay event tới muộn.
      OBSERVER_MISSED_EVENTS: >-
        Tương thích với bằng chứng (event có thể đã nằm chờ trong broker), không được xác
        lập bởi nó.

    assumptions:
      - Workflow ORDER_SAGA 1.0 có hiệu lực; timeout 10 s của PROCESS_PAYMENT đọc từ declaration.
      - >-
        Không có event PAYMENT_STARTED, nên khoảng 48.8 s tính từ ORDER_CREATED — nó bao
        gồm cả thời gian message nằm trong Kafka chờ consumer. Claim không được phát biểu
        như thể đó là thời gian payment-service xử lý.
      - Đồng hồ hai service so sánh được; nguồn timestamp không được lưu (ROADMAP F6).

