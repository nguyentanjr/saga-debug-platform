# ── ĐỐI CHỨNG 1 CỦA docs/ORACLE.md MỤC 7, CÓ SẴN TRONG DỮ LIỆU ────────────────
#
# SC27, SC28, SC29 tiêm BA nguyên nhân thật khác hẳn nhau:
#   SC27  docker pause          -- tiến trình bị đóng băng, container còn trong mạng
#   SC28  SIGSTOP vào PID 1     -- tiến trình bị dừng bởi tín hiệu, container nguyên vẹn
#   SC29  disconnect network    -- tiến trình chạy bình thường, mất đường mạng
#
# Và sinh ra CÙNG MỘT HÌNH DẠNG quan sát:
#   ORDER_CREATED -> (im lặng 46–49 s) -> PAYMENT_COMPLETED -> INVENTORY_RESERVED, COMPLETED
#
# ⚠️ ĐÃ THU HẸP 2026-09-21 sau review (ROADMAP L11). Bản trước viết "không một trường nào
# phân biệt được ba ca", và như thế là nói quá: sáu tập observation KHÁC NHAU — khác
# eventId, khác timestamp, khác transportRef, khác độ dài khoảng im lặng. Chúng không phải
# một tập observation theo nghĩa mục 2, nên đây KHÔNG phải đối chứng "hai input đồng nhất".
#
# Phát biểu đo được, và là phát biểu đủ cho lập luận:
#
#   1. Tập tên trường trong payload giống nhau ở cả ba kịch bản, và không trường nào mang
#      giá trị đặc trưng cho loại sự cố. Không event nào báo lỗi, không event nào nói về
#      tiến trình, tín hiệu hay mạng.
#   2. Thứ duy nhất khác nhau về lượng là độ dài khoảng im lặng — mà nó KHÔNG phân biệt
#      được ba kịch bản: độ tản TRONG một kịch bản lên tới 2.586 s (SC27: 46.257 / 48.843),
#      lớn hơn chênh lệch trung bình lớn nhất GIỮA hai kịch bản bất kỳ (1.502 s).
#      Một đại lượng mà biến thiên nội bộ lấn át biến thiên giữa các nhóm thì không phải
#      dấu hiệu phân biệt.
#
# Hệ quả: bất kỳ nhãn nào NÊU TÊN loại sự cố đều vượt bằng chứng ở cả ba kịch bản. Không
# phải vì ba tập observation giống hệt nhau, mà vì không tập nào chứa dấu hiệu nào của
# loại sự cố đã gây ra nó.
