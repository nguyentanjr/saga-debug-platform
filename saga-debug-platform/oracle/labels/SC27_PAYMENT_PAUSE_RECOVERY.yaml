# ── ĐỐI CHỨNG 1 CỦA docs/ORACLE.md MỤC 7, CÓ SẴN TRONG DỮ LIỆU ────────────────
#
# SC27, SC28, SC29 tiêm BA nguyên nhân thật khác hẳn nhau:
#   SC27  docker pause          -- tiến trình bị đóng băng, container còn trong mạng
#   SC28  SIGSTOP vào PID 1     -- tiến trình bị dừng bởi tín hiệu, container nguyên vẹn
#   SC29  disconnect network    -- tiến trình chạy bình thường, mất đường mạng
#
# Và sinh ra CÙNG MỘT hình dạng quan sát, không sai một chi tiết nào:
#   ORDER_CREATED -> (im lặng 46–49 s) -> PAYMENT_COMPLETED -> INVENTORY_RESERVED, COMPLETED
#
# Đây là đối chứng "cùng evidence, khác true_cause" mà mục 7 đòi, và nó không phải thiết
# kế thêm — nó đã nằm sẵn trong bộ 27 lượt. Hệ quả: bất kỳ nhãn nào NÊU TÊN loại sự cố
# đều là kết luận không được bảo đảm ở cả ba kịch bản, vì cùng một bằng chứng phải cho
# cùng một kết luận, mà ba sự thật thì khác nhau.
