# ── Ba lượt là MỘT CHUỖI CÓ TRẠNG THÁI, không phải ba mẫu ─────────────────────
#
# Cửa sổ trượt của breaker cộng dồn qua các lượt, nên đảo thứ tự sẽ cho ba nhãn khác.
# Mốc thời gian tuyệt đối của chuỗi này (tính từ scored_at trừ đi khoảng im lặng đã ghi):
#
#   lượt 1  11:46:37.8 -> 11:46:45.0   breaker CLOSED suốt lượt
#   lượt 2  11:47:26.3 -> 11:47:33.4   CLOSED_TO_OPEN lúc 11:47:26.387
#   lượt 3  11:48:14.7 -> 11:48:21.7   HALF_OPEN_TO_OPEN lúc 11:48:17.682
#
# Hai transition đó khớp tới từng mili-giây với chính các quan sát retry, nên trạng thái
# breaker ở đây được xác minh chứ không suy đoán:
#   lượt 2: CLOSED_TO_OPEN 11:47:26.387 trùng retry lần 1 (11:47:26.388) -> lời gọi đầu
#           làm breaker mở, hai retry sau bị từ chối.
#   lượt 3: HALF_OPEN_TO_OPEN 11:48:17.682 trùng retry lần 3 (11:48:17.682) -> ba lời gọi
#           trong HALF_OPEN đều hỏng vì gateway, lời gọi thứ tư mới bị từ chối.
#
# Chuỗi này LẶP LẠI được hình mẫu của chuỗi 06:53: lượt 1 breaker đóng, lượt 2 và 3 có
# lời gọi bị từ chối. Hai chuỗi độc lập trong cùng một ngày, cùng một hình mẫu.

# ── Giới hạn của kênh ground truth, phát hiện khi dán nhãn ────────────────────
#
# `breaker_transitions` đọc từ /actuator/circuitbreakerevents, mà Resilience4j giữ trong
# một vòng đệm `eventConsumerBufferSize: 10` DÙNG CHUNG cho mọi loại event (success,
# error, not_permitted, state_transition). Bằng chứng cho tính mất mát nằm ngay trong
# artefact: danh sách của lượt 3 KHÔNG còn CLOSED_TO_OPEN lúc 11:47:26 mà danh sách của
# lượt 2 có. Nên một danh sách transition rỗng hay ngắn KHÔNG chứng minh là không có
# transition nào — nó chỉ chứng minh không có transition nào còn lại trong vòng đệm.
# Ở lượt 1 kết luận "breaker đóng" đứng được vì có nguồn thứ hai độc lập với vòng đệm:
# snapshot lúc lấy mẫu là CLOSED với notPermittedCalls = 0.
