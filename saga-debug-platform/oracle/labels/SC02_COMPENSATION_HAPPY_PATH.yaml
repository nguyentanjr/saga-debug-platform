# ⚠️ KHÔNG còn là nhãn mù. Xem `amendments`: tập claim của cả 5 lượt bị sửa SAU khi đã đọc
# output của platform. Phần viết mù là bản gốc ở commit 16382e2, không phải file này.
labelling: blind_then_amended_after_output
labelling_note: >-
  Bản gốc (16382e2) viết trước khi đọc rca_* hay anomalies_actual của SC02, với caveat như
  SC01: người dán nhãn biết số tổng của cả bộ. Nhưng bản gốc ĐÃ BỊ SỬA sau khi đọc output
  — xem amendments — nên file hiện tại phải được báo cáo là hồi cứu, và câu "toàn bộ
  admissible_claims được khóa trước output" KHÔNG áp cho 5 lượt này.
reviewed_by: null

amendments:
  - at: "2026-09-21"
    after_commit: 16382e2
    after_reading_platform_output: true
    change: Thêm FORWARD_STEP_FAILED vào admissible_claims của cả 5 lượt.
    why: >-
      Bản gốc chỉ có STEP_REJECTED_WITH_SOURCE_REASON và COMPENSATION_COMPLETED_AS_DECLARED.
      Platform ra FORWARD_STEP_FAILURE (R11), mà R11 kết luận từ trạng thái COMPENSATED
      cộng chuỗi bù trừ đã hoàn tất — nó KHÔNG đọc trường lý do. Bản mù thiếu một claim mà
      bằng chứng có đỡ được; chỗ thiếu ấy lộ ra vì đã đọc output.
    effect_on_score: >-
      ĐÃ SỬA LẠI 2026-09-21 sau review (ROADMAP L11). Ghi chú cũ nói "bỏ claim này đi thì
      5 lượt thành UNSCORED" là SAI. Đã chạy thử: bỏ FORWARD_STEP_FAILED khỏi
      admissible_claims mà vẫn giữ nó trong từ vựng thì 5 lượt thành **kết luận không được
      bảo đảm**, không phải UNSCORED. UNSCORED chỉ xảy ra khi bỏ luôn cả claim lẫn phép map
      khỏi claims.yaml. Nghĩa là sửa đổi này chuyển 5 lượt từ "không được bảo đảm" sang
      "kết luận đúng" — nó ĐỔI ĐIỂM, và phải được đọc như vậy.
      Pin trong test: oracle/test_score.py
      test_dropping_a_claim_from_a_case_is_unwarranted_not_unscored.
    why_it_was_kept_anyway: >-
      Claim này đứng được trên chính bằng chứng, độc lập với việc platform nói gì: có
      INVENTORY_FAILED, có REFUND_PAYMENT và PAYMENT_REFUNDED, saga ở COMPENSATED. Nó cũng
      YẾU HƠN claim đã có sẵn trong tập, và không mục nào bị gỡ khỏi inadmissible_claims.
      Nhưng "claim đúng" không làm cho việc sửa sau khi xem output thành trung lập — nên
      cả hai bộ số phải được báo cáo, xem docs/ORACLE.md mục 5.5.
    how_to_report: >-
      Có sửa đổi: 18 kết luận đúng / 0 không được bảo đảm. Không có sửa đổi: 13 kết luận
      đúng / 5 không được bảo đảm. Trích cả hai, đừng trích một.

cases:

  - &compensated
    id: SC02_COMPENSATION_HAPPY_PATH
    run_index: 1
    scored_at_status: COMPENSATED
    case_kind: business_failure

    true_cause:
      injected: >-
        Đặt quantity 9999 vượt tồn kho. inventory-service từ chối theo luật nghiệp vụ của
        chính nó; không service nào bị dừng, không lỗi hạ tầng nào được tiêm.
      note: >-
        Đây là ca duy nhất trong bộ mà thất bại là KẾT QUẢ NGHIỆP VỤ ĐÚNG, không phải sự
        cố. Nó kiểm một thứ khác hẳn các ca còn lại: platform có phân biệt được "hệ chạy
        đúng và từ chối" với "hệ hỏng" hay không.

    available_evidence:
      events: [ORDER_CREATED, PAYMENT_COMPLETED, INVENTORY_FAILED, REFUND_PAYMENT, PAYMENT_REFUNDED]
      span_ms: 148
      failure_reason: "Not enough inventory"       # trong payload của INVENTORY_FAILED
      compensation_reason: "Inventory reservation failed"   # trong payload của REFUND_PAYMENT
      discriminating_field: >-
        Hai trường lý do khác nhau, mỗi trường do một service khác nhau viết, và cả hai
        mang nội dung riêng của tình huống chứ không phải một chuỗi hằng ghi ở mọi thất
        bại. RESERVE_INVENTORY thất bại sau 48 ms — không có khoảng im lặng nào.

    admissible_claims:
      - STEP_REJECTED_WITH_SOURCE_REASON
      - COMPENSATION_COMPLETED_AS_DECLARED
      - FORWARD_STEP_FAILED        # thêm sau, xem khối `amendments` ở đầu file
    abstention_required: false
    admissible_note: >-
      Bằng chứng đỡ được tới mức: "RESERVE_INVENTORY thất bại với lý do hệ nguồn tự nêu,
      và chuỗi bù trừ đã khai báo chạy xong". Nó KHÔNG đỡ được tới mức "hết hàng" như một
      sự thật về kho — observer chỉ biết inventory-service nói vậy.

    inadmissible_claims:
      SOURCE_SERVICE_UNAVAILABLE: >-
        inventory-service trả lời trong 48 ms. Không có gì cho thấy nó không sẵn sàng.
      STEP_EXCEEDED_DECLARED_TIMEOUT: >-
        Khoảng dài nhất là 148 ms cho cả execution, dưới mọi timeout đã khai.
      TIMEOUT_DRIVEN_RETRY_BURST: Không có quan sát retry nào trong lượt.

    assumptions:
      - Workflow ORDER_SAGA 1.0 có hiệu lực; REFUND_PAYMENT là compensation đã khai của PROCESS_PAYMENT.
      - >-
        Phân loại "Not enough inventory" là lỗi nghiệp vụ chứ không phải lỗi hạ tầng là
        một khai báo phụ thuộc hệ nguồn (I7), giống hệt khai báo failure-signal của SC06.
        Core không được biết trước cách diễn đạt này. Nếu chưa có khai báo cho nguồn đó
        thì claim phải dừng ở "hệ nguồn nêu lý do X", không được tự phân loại.
      - >-
        Đồng hồ các service so sánh được; nguồn timestamp không được lưu (ROADMAP F6).

