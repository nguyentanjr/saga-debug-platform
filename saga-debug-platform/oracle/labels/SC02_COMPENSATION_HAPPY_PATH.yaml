  - &compensated
    id: SC02_COMPENSATION_HAPPY_PATH
    run_index: 1
    scored_at_status: COMPENSATED
    case_kind: business_failure

    true_cause:
      injected: >-
        Đặt quantity 9999 vượt tồn kho. inventory-service từ chối theo luật nghiệp vụ của
        chính nó; không service nào bị dừng, không lỗi hạ tầng nào được tiêm.
      note: >-
        Đây là ca duy nhất trong bộ mà thất bại là KẾT QUẢ NGHIỆP VỤ ĐÚNG, không phải sự
        cố. Nó kiểm một thứ khác hẳn các ca còn lại: platform có phân biệt được "hệ chạy
        đúng và từ chối" với "hệ hỏng" hay không.

    available_evidence:
      events: [ORDER_CREATED, PAYMENT_COMPLETED, INVENTORY_FAILED, REFUND_PAYMENT, PAYMENT_REFUNDED]
      span_ms: 148
      failure_reason: "Not enough inventory"       # trong payload của INVENTORY_FAILED
      compensation_reason: "Inventory reservation failed"   # trong payload của REFUND_PAYMENT
      discriminating_field: >-
        Hai trường lý do khác nhau, mỗi trường do một service khác nhau viết, và cả hai
        mang nội dung riêng của tình huống chứ không phải một chuỗi hằng ghi ở mọi thất
        bại. RESERVE_INVENTORY thất bại sau 48 ms — không có khoảng im lặng nào.

    admissible_claims:
      - STEP_REJECTED_WITH_SOURCE_REASON
      - COMPENSATION_COMPLETED_AS_DECLARED
      - FORWARD_STEP_FAILED        # thêm sau, xem khối `amendments` ở đầu file
    abstention_required: false
    admissible_note: >-
      Bằng chứng đỡ được tới mức: "RESERVE_INVENTORY thất bại với lý do hệ nguồn tự nêu,
      và chuỗi bù trừ đã khai báo chạy xong". Nó KHÔNG đỡ được tới mức "hết hàng" như một
      sự thật về kho — observer chỉ biết inventory-service nói vậy.

    inadmissible_claims:
      SOURCE_SERVICE_UNAVAILABLE: >-
        inventory-service trả lời trong 48 ms. Không có gì cho thấy nó không sẵn sàng.
      STEP_EXCEEDED_DECLARED_TIMEOUT: >-
        Khoảng dài nhất là 148 ms cho cả execution, dưới mọi timeout đã khai.
      TIMEOUT_DRIVEN_RETRY_BURST: Không có quan sát retry nào trong lượt.

    assumptions:
      - Workflow ORDER_SAGA 1.0 có hiệu lực; REFUND_PAYMENT là compensation đã khai của PROCESS_PAYMENT.
      - >-
        Phân loại "Not enough inventory" là lỗi nghiệp vụ chứ không phải lỗi hạ tầng là
        một khai báo phụ thuộc hệ nguồn (I7), giống hệt khai báo failure-signal của SC06.
        Core không được biết trước cách diễn đạt này. Nếu chưa có khai báo cho nguồn đó
        thì claim phải dừng ở "hệ nguồn nêu lý do X", không được tự phân loại.
      - >-
        Đồng hồ các service so sánh được; nguồn timestamp không được lưu (ROADMAP F6).

